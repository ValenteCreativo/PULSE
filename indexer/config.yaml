# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: pulse-intelligence-market
description: Indexes PULSE purchase entitlements on Monad testnet after deployment.

contracts:
  - name: PulseIntelligenceMarket
    events:
      - event: "IntelligencePurchased(address indexed buyer, bytes32 indexed topicId, bytes32 indexed productId, uint256 amount, bytes32 purchaseId)"
        field_selection:
          transaction_fields:
            - hash

chains:
  - id: 10143 # Monad testnet
    start_block: 70583679 # PulseIntelligenceMarket deployment block; avoid an unnecessary genesis scan.
    rpc:
      url: https://testnet-rpc.monad.xyz
      for: sync
    contracts:
      - name: PulseIntelligenceMarket
        address: "0x0a14814aa3d4fd9c2e17090af23a655204993bff"
